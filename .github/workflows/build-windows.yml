name: Build Portable Windows

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build portable executable (onedir)
        run: pyinstaller --noconsole --onedir --name "Comparador_Fallecidos_Citas" app/main.py

      - name: Remove generated reports/logs from artifact payload
        shell: pwsh
        run: |
          if (Test-Path "dist/Comparador_Fallecidos_Citas/reportes_generados") {
            Remove-Item "dist/Comparador_Fallecidos_Citas/reportes_generados" -Recurse -Force
          }
          if (Test-Path "dist/Comparador_Fallecidos_Citas/logs") {
            Remove-Item "dist/Comparador_Fallecidos_Citas/logs" -Recurse -Force
          }

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Comparador_Fallecidos_Citas_PORTABLE_WINDOWS
          path: dist/Comparador_Fallecidos_Citas
          if-no-files-found: error
